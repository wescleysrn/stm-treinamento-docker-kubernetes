version: "3"

services:
  sonarqube:
    image: sonarqube:lts-community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/db-sonar
      SONAR_JDBC_USERNAME: user_sonar
      SONAR_JDBC_PASSWORD: user_sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

volumes:
  sonarqube_data:
    external: true
    name: sonarqube_data
  sonarqube_extensions:
    external: true
    name: sonarqube_extensions
  sonarqube_logs:
    external: true
    name: sonarqube_logs
