apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: default
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.stmcurso.com.br
      secretName: stm-curso-tls-secret
  rules:
    - host: grafana.stmcurso.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80

