apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stm-localizacao-ingress
  namespace: stm-localizacao-ibge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0" # Permite uploads sem limite de tamanho
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - localizacao.stmcurso.com.br
    secretName: stm-curso-tls-secret
  rules:
  - host: localizacao.stmcurso.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stm-localizacao-service
            port:
              number: 8080
