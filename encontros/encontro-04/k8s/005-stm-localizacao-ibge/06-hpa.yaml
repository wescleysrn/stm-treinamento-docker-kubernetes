apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stm-localizacao-rs-hpa
  namespace: stm-localizacao-ibge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stm-localizacao-rs-deployment
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30  # Aguarda 30s de pico constante antes de criar novos pods
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
