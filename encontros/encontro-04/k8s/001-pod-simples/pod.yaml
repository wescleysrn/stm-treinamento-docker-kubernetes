apiVersion: v1
kind: Pod
metadata:
  name: pod-web-servidor
  namespace: default
  labels:
    app: webserver
    ambiente: treinamento
spec:
  containers:
    - name: container-nginx
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
    