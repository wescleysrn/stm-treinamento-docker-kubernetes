apiVersion: v1
kind: Pod
metadata:
  name: pod-nginx-custom
  namespace: desenvolvimento
  labels:
    app: web-custom
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "<html><body><h1>Aula de K8s: Pod Customizado Nginx</h1></body></html>" > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'
